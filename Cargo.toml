[package]
name = "language-lab"
version = "0.1.0"
edition = "2021"
description = "Persistent learning memory and review scheduling for a language tutor"
repository = "https://github.com/nikomatsakis/language-lab"
include = ["src/**", "tests/*.rs", "skills/language-lab/SKILL.md", "SYMPOSIUM.toml", "Cargo.lock", "README.md"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[workspace]
resolver = "3"
members = []
